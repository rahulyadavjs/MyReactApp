name: Docker CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Show Version
        run: echo "Version = ${{ github.run_number }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t rahultech8/myreactapp:${{ github.run_number }} .
          docker tag rahultech8/myreactapp:${{ github.run_number }} rahultech8/myreactapp:latest

      - name: Push Docker Images
        run: |
          docker push rahultech8/myreactapp:${{ github.run_number }}
          docker push rahultech8/myreactapp:latest